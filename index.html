<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vereinsheim Kasse</title>

<style>
body{
  font-family:Arial,sans-serif;
  margin:0;
  background:#f2f2f2;
}

.header{
  background:white;
  padding:15px;
  position:sticky;
  top:0;
  box-shadow:0 2px 5px rgba(0,0,0,.1);
}

.stats{
  display:flex;
  gap:10px;
  margin-top:10px;
}

.stat{
  flex:1;
  background:#e8f5e9;
  padding:10px;
  border-radius:10px;
  text-align:center;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  padding:10px;
}

.card{
  background:white;
  border-radius:12px;
  padding:15px;
  text-align:center;
  cursor:pointer;
  box-shadow:0 2px 4px rgba(0,0,0,.1);
}

.card:active{
  transform:scale(0.98);
}

.name{
  font-size:20px;
  font-weight:bold;
}

.price{
  color:#666;
  margin-top:5px;
}

.count{
  margin-top:10px;
  font-size:28px;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="header">
  <h2>⚽ Vereinsheim Kasse</h2>

  <select id="veranstaltung">
  <option>Training</option>
  <option>Heimspiel Jugend</option>
  <option>Heimspiel Aktive</option>
  <option>Turnier</option>
  <option>Vereinsfest</option>
  <option>Sonstiges</option>
</select>

<button onclick="tagesabschluss()">
📋 Tagesabschluss
</button>
  <div class="stats">
    <div class="stat">
      <div>Umsatz</div>
      <strong id="umsatz">0,00 €</strong>
    </div>

    <div class="stat">
      <div>Kasse</div>
      <strong id="kasse">150,00 €</strong>
    </div>

    <div class="stat">
      <div>Entnahme</div>
      <strong id="entnahme">0,00 €</strong>
    </div>
  </div>
</div>

<div class="grid" id="grid"></div>
<hr>

<h2>📈 Historie</h2>

<div id="historieAnzeige"></div>
<script>

const artikel = [
  {name:"🍺 Bier",preis:2.8},
  {name:"📦 Bierkasten",preis:35},
  {name:"🍺 Mixery",preis:2.8},
  {name:"🍺 Mixery Blue",preis:2.8},
  {name:"🥤 Cola",preis:2.3},
  {name:"🥤 Fanta",preis:2.3},
  {name:"🥤 Sprite",preis:2.3},
  {name:"🥤 Gründels Fresh",preis:2.3},
  {name:"💧 Sprudel",preis:1.8},
  {name:"🧃 Eistee Zitrone",preis:1.8},
  {name:"🧃 Eistee Pfirsich",preis:1.8},
  {name:"☕ Kaffee",preis:1.5}
];

let daten =
JSON.parse(localStorage.getItem("vereinskasse"))
|| {};

artikel.forEach(a=>{
 if(!daten[a.name]) daten[a.name]=0;
});

function speichern(){
 localStorage.setItem(
   "vereinskasse",
   JSON.stringify(daten)
 );
 render();
}

function render(){

 let html="";
 let umsatz=0;

 artikel.forEach(a=>{

   umsatz += daten[a.name]*a.preis;

   html += `
<div class="card">
  <div class="name">${a.name}</div>
  <div class="price">${a.preis.toFixed(2)} €</div>

  <div style="margin-top:10px;">
    <button onclick="minus('${a.name}')">➖</button>

    <span style="
      font-size:28px;
      font-weight:bold;
      margin:0 15px;
    ">
      ${daten[a.name]}
    </span>

    <button onclick="verkauf('${a.name}')">➕</button>
  </div>
</div>
`;
 });

 document.getElementById("grid").innerHTML=html;

 document.getElementById("umsatz")
 .innerText=umsatz.toFixed(2)+" €";

 document.getElementById("kasse")
 .innerText=(150+umsatz).toFixed(2)+" €";

 document.getElementById("entnahme")
 .innerText=umsatz.toFixed(2)+" €";

let historieHTML = "";

historie
.slice()
.reverse()
.forEach((eintrag)=>{

  historieHTML += `
  <div style="
    background:white;
    padding:10px;
    margin:10px;
    border-radius:10px;
  ">
    <b>${eintrag.datum}</b><br>
    ${eintrag.veranstaltung}<br>
    Umsatz: ${eintrag.umsatz} €
  </div>
  `;
});

document.getElementById("historieAnzeige").innerHTML = historieHTML;

}
  
  function verkauf(name){
 daten[name]++;
 speichern();
}

  function minus(name){

  if(daten[name] > 0){
    daten[name]--;
    speichern();
  }

}
let historie =
JSON.parse(localStorage.getItem("historie"))
|| [];

function tagesabschluss(){
if(!confirm("Tagesabschluss durchführen?")){
  return;
}
  let umsatz = 0;

  artikel.forEach(a=>{
    umsatz += daten[a.name] * a.preis;
  });

  historie.push({
    datum:new Date().toLocaleDateString("de-DE"),
    veranstaltung:
      document.getElementById("veranstaltung").value,
    umsatz:umsatz.toFixed(2),
    daten:{...daten}
  });

  localStorage.setItem(
    "historie",
    JSON.stringify(historie)
  );

  if(confirm("Tagesabschluss speichern und Tageszähler zurücksetzen?")){

  alert("Tagesabschluss gespeichert");

  artikel.forEach(a=>{
    daten[a.name] = 0;
  });

  speichern();
}
  render();
}render();

</script>

</body>
</html>
