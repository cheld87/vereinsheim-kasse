<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vereinsheim Kasse</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="header">
  <h2>⚽ Vereinsheim Kasse</h2>

  <select id="veranstaltung">
  <option>Training</option>
  <option>Heimspiel Jugend</option>
  <option>Heimspiel Aktive</option>
  <option>Turnier</option>
  <option>Vereinsfest</option>
  <option>Sonstiges</option>
</select>

<button onclick="tagesabschluss()">
📋 Tagesabschluss
</button>
  <div class="stats">
    <div class="stat">
      <div>Umsatz</div>
      <strong id="umsatz">0,00 €</strong>
    </div>

    <div class="stat">
      <div>Kasse</div>
      <strong id="kasse">150,00 €</strong>
    </div>

    <div class="stat">
      <div>Entnahme</div>
      <strong id="entnahme">0,00 €</strong>
    </div>
  </div>
</div>

  <div style="
background:white;
margin:10px;
padding:10px;
border-radius:10px;
">

<h2>🛒 Aktueller Verkauf</h2>

<div id="warenkorbAnzeige">
Noch keine Artikel
</div>

<h3>
Gesamt:
<span id="warenkorbGesamt">
0,00 €
</span>
</h3>

    <div style="margin-top:10px;">

<h3>💵 Bezahlt</h3>

<input
  id="bezahlt"
  type="number"
  step="0.01"
  placeholder="0.00"
  oninput="berechneRueckgeld()"
>

</div>

<h3>
💰 Rückgeld:
<span id="rueckgeld">
0,00 €
</span>
</h3>

    <div style="margin-bottom:10px;">

<button onclick="setBezahlt(5)">5 €</button>

<button onclick="setBezahlt(10)">10 €</button>

<button onclick="setBezahlt(20)">20 €</button>

<button onclick="setBezahlt(50)">50 €</button>

</div>  

    <button onclick="verkaufAbschliessen()">
✅ Verkauf abschließen
</button>

  </div>

  <div class="grid" id="grid"></div>
<hr>

<h2>📈 Historie</h2>

<div id="historieAnzeige"></div>

  <script src="app.js"></script>

</body>
</html>
